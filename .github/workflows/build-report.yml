name: Build visibility report

# One-off report for a prospect: slug/index.html. Built with the same builder and template as the
# recurring client reports (GregUniK/ai-visibility, labs/tools), so a new report has the fixed
# Overview filters, the fan-out tab and no third-party tag.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Report slug (lowercase, used as URL path)'
        required: true
      brand_id:
        description: 'Tracked brand UUID'
        required: true
      brand_name:
        description: 'Brand display name'
        required: true
      domain:
        description: 'Brand domain (e.g. pianopiano.com)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sales repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Get the report builder
        run: git clone --depth=1 https://github.com/GregUniK/ai-visibility /tmp/report-tool

      - name: Install dependencies
        run: pip install -r /tmp/report-tool/labs/tools/requirements.txt

      - name: Check the slug
        env:
          BRAND_SLUG: ${{ inputs.slug }}
        run: |
          case "$BRAND_SLUG" in
            ''|*[!a-z0-9-]*) echo "Slug must be lowercase letters, digits and hyphens"; exit 1;;
          esac

      - name: Create config
        env:
          BRAND_ID: ${{ inputs.brand_id }}
          BRAND_NAME: ${{ inputs.brand_name }}
          BRAND_SLUG: ${{ inputs.slug }}
          BRAND_DOMAIN: ${{ inputs.domain }}
        run: |
          python3 -c "
          import json, os
          cfg = {'brands': [{
            'id': os.environ['BRAND_ID'],
            'name': os.environ['BRAND_NAME'],
            'key': os.environ['BRAND_SLUG'],
            'domain': os.environ['BRAND_DOMAIN'],
          }]}
          json.dump(cfg, open('/tmp/report-tool/sales-config.json', 'w'), indent=2)
          "

      - name: Build report
        env:
          AIV_API_KEY: ${{ secrets.PEEKABOO_SALES_KEY }}
          BRAND_SLUG: ${{ inputs.slug }}
        run: |
          mkdir -p "$BRAND_SLUG"
          python3 /tmp/report-tool/labs/tools/build_labs.py --live \
            --config /tmp/report-tool/sales-config.json --out "$BRAND_SLUG/index.html"

      - name: Check the page
        env:
          BRAND_SLUG: ${{ inputs.slug }}
        run: |
          f="$BRAND_SLUG/index.html"
          test -s "$f"
          grep -q 'name="robots" content="noindex,nofollow"' "$f"
          if grep -qi 'G-YV8FCLN403' "$f"; then echo "third-party tag in the page"; exit 1; fi

      - name: Commit and push
        env:
          BRAND_SLUG: ${{ inputs.slug }}
        run: |
          git config user.name "Report Bot"
          git config user.email "bot@gregunik.github.io"
          git add "${BRAND_SLUG}/index.html"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "report(${BRAND_SLUG}): $(date -u +%Y-%m-%d)"
            git push
          fi
